version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: falcon-postgres
    restart: always
    environment:
      POSTGRES_USER: falcon_user
      POSTGRES_PASSWORD: falcon_password
      POSTGRES_DB: falcon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon_user -d falcon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: falcon-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:latest
    container_name: falcon-coturn
    restart: always
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
    volumes:
      - ./config/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    network_mode: "host"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: falcon-otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Metrics

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: falcon-jaeger
    restart: always
    ports:
      - "16686:16686" # Web UI
      - "14268:14268"

volumes:
  postgres_data:
  redis_data:
